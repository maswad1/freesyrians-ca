name: Generate branded website icons and share images
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-share-assets.py
      - .github/workflows/generate-share-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate favicon and share images
        run: python scripts/generate-share-assets.py
      - name: Publish generated assets
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/favicon-eagle.png assets/favicon-event.png assets/share-main.jpg assets/share-event-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add generated brand favicons and social share previews"
            git push
          fi
